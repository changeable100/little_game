# ============================================================
# 交接清单 Manifest 模板
# 黄山派嵌入式产品开发实验课程 · Agent协作开发与评审机制
#
# 用途：Dev Agent（学生侧）按此schema生成提交材料，
#       Eval Agent（教师侧）按此schema解析并评审。
# 使用方法：复制本文件为 submission_<学号或组号>_<里程碑>.yaml，
#          按字段填写；带 <> 的地方替换成实际内容。
# 重要：本文件中除 dev_agent.model / dev_agent.tool 等元信息栏位外，
#      其余内容应尽量由agent在开发过程中自动生成/追加，
#      而不是学生在提交前手写编造——手写内容的可信度视同人工记录，
#      不享有"agent执行留痕"的免核验优先级。
# ============================================================

submission:
  student_id: "<学号，例如 S2026001>"
  student_name: "<姓名>"
  group_id: "<组别，例如 G3>"
  milestone: "<里程碑名称，例如 阶段4-AI语音集成 / Capstone-检查点2 / Capstone-终版>"
  submitted_at: "<ISO时间戳，例如 2026-11-03T21:40:00+08:00>"

dev_agent:
  tool: "<使用的agent工具，例如 Claude Code>"
  model: "<模型版本，例如 claude-sonnet-5，请据实填写，不要凭记忆猜测>"
  session_log_path: "<完整会话记录文件路径，必须是原始导出，不可编辑>"
  session_log_hash: "<可选：会话记录文件的哈希值，用于防止事后篡改>"

requirements:
  prd_path: "<需求规格说明路径，默认 docs/01-需求规格说明.md>"
  hardware_constraints_ref: "<引用的硬件规格文档，例如黄山派硬件手册链接或本地副本路径>"

design:
  architecture_doc_path: "<方案设计说明路径，默认 docs/02-方案设计说明.md>"
  key_decisions:
    # 每一条关键决策都要写清楚：决策内容 / 考虑过的备选方案 / 选择理由 / 谁做的最终决定
    - decision: "<例如：选择BLE而非WiFi做数据同步>"
      alternatives_considered: "<例如：曾考虑过用SD卡离线导出，因为使用场景需要实时同步而放弃>"
      rationale: "<为什么最终这么选，写具体理由，不要只写'效果更好'>"
      decided_by: "<agent建议+学生确认 / 学生主导 / 纯agent自动决定（不建议用于关键决策）>"

    - decision: "已采纳 A：王若豪负责 IMU/模型/集成，另一成员负责 UI/关卡；游戏与 UI 同线程有界步进，IMU 提供复制快照"
      alternatives_considered: "UI 线程运行有界游戏步进与独立游戏任务两种方案；详见 docs/adr/0001-maze-collaboration.md"
      rationale: "先约定状态、坐标、地图、操作与失败处理，减少双人开发重复状态和接口冲突；调度代价需结合例程与实测评审"
      decided_by: "王若豪审阅后回复选择方案 A 并要求开始；另一成员姓名待补，未代记其确认"
    - decision: "已采纳 A：连续滚动小球，首版一张固定地图、校准、暂停继续、终点和重开"
      alternatives_considered: "B 为按格移动或多关卡及成绩记录；详见 docs/adr/0002-maze-first-playable.md"
      rationale: "沿用任务书方案 A，先完成体感控制的一局闭环；运动与碰撞先由独立模型自检验证"
      decided_by: "王若豪选择方案 A；初始数值与接口由 agent 在已选路线内落实，不声称硬件已验证"

code:
  repo_url: "<git仓库地址>"
  commit_range: "<起始commit..结束commit，对应本次里程碑>"

physical_verification:
  # 每一个物理验证节点都要有对应记录，节点类型见配套文档《Agent协作开发与评审机制》第三节表格
  - item: "<验证项名称，例如：固件烧录与串口启动log>"
    required_action: "<agent当时要求学生具体做什么>"
    executed_at: "<学生实际执行的时间戳>"
    evidence_path: "<原始证据文件路径：照片/视频/日志/示波器截图>"
    agent_conclusion: "<agent基于该证据得出的结论，例如：启动正常，IMU初始化成功>"

  - item: "T0 串口运行证据审阅"
    required_action: "学生烧录后以 1000000 波特率查看启动与 RGB 循环日志，并上传证据。"
    executed_at: "待学生确认实际执行时间；截图显示 15:12:45 至 15:13:05，日期未显示"
    evidence_path: "evidence/T0/屏幕截图 2026-10-10 151315.png"
    agent_conclusion: "截图显示 COM4 已连接、1000000 baud、Hello world! 及多轮 red/green/blue 日志，确认例程正在运行；截图未包含 boot ok 或烧录成功输出，不能确认完整启动流程及实际灯光。"
  - item: "T0 RGB 原始视频待审"
    required_action: "上传真实 RGB 红绿蓝闪烁视频。"
    executed_at: "待学生确认；不以文件名作为实测时间"
    evidence_path: "evidence/T0/VID_20261010_151622.mp4"
    agent_conclusion: "已收到 29901304 字节原始视频。视频解码 DLL 被 Windows 应用程序控制策略阻止，未能观看，RGB 行为暂未判定。视频受 .gitignore 忽略，后续需提供可访问的归档链接或小体积证据。"

  - item: "T0 RGB 视频重新审阅成功"
    required_action: "学生上传原始视频后要求再次尝试审阅。"
    executed_at: "实际拍摄时间待学生确认；2026-10-10 审阅"
    evidence_path: "evidence/T0/rgb_video_frames_2026-10-10.png"
    agent_conclusion: "本次成功解码原始 VID_20261010_151622.mp4（10.5 秒），按视频时间每 0.5 秒提取画面。前段 0/1/2 秒与 3/4/5 秒分别可见红/绿/蓝，间隔画面中 RGB 熄灭（旁边绿指示灯仍亮）。确认 RGB 顺序循环及间歇熄灭的基本行为，与例程一致；未精确测量 500 ms 时序。后半段拍摄电脑串口。派生图片供复核，原视频保留；此前待审状态由本次结果补充，不删除历史失败记录。"

  - item: "T0 完整启动截图复核"
    required_action: "学生回传包含 boot ok 的启动截图，agent 核对已有证据。"
    executed_at: "实际启动时间未确认；证据于前次会话已查看，2026-10-17 再次复核"
    evidence_path: "evidence/T0/屏幕截图 2026-10-10 153048.png"
    agent_conclusion: "可见 SDK 2.5.1 启动输出、rgbled register success、[course_starter] v0.1.0 boot ok、Hello world! 及连续 red/green/blue 日志。结合此前视频审阅，T0 基础启动、串口输出与 RGB 循环已验证通过；截图不能证明 CodeKit 软件复位按钮有效，也不作为精确闪烁时序测量。"

test_results:
  - test_id: "<测试编号，例如 TC-01>"
    description: "<测试内容简述>"
    expected: "<预期结果>"
    actual: "<实测结果>"
    pass: <true 或 false>
    evidence_path: "<对应的原始数据/截图路径>"

known_issues:
  - "王若豪已选择方案 A；另一成员姓名、板卡数量、正式地图/布局与 UI 资源验收值待补，游戏/IMU/UI 的新板端功能均未验证"
  - "<已知问题1，真实项目通常都有未解决或有局限性的地方，主动说明比隐瞒更可信>"

self_review: |
  <agent生成的自我复盘，包括：本次里程碑完成度如何、哪些地方agent自己也不确定、
  哪些决策是在学生介入/纠正之后才修改的。建议由agent在里程碑结束时自动生成，
  不建议学生代写。>

human_checkpoints:
  # 用于区分"学生自己做的决定"和"agent建议、学生只是同意"
  - decision_point: "<例如：是否采用非线性PWM映射>"
    student_confirmation: "<学生对该决策的确认说明，最好包含'为什么认可/为什么修改'的具体理由>"

