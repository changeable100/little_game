design:
  architecture_doc_path: docs/02-方案设计说明.md
  key_decisions:
  - decision: 三维第一关采用 M1 三段缓坡和两个平转角，见 ADR-0012
    alternatives_considered: M2 长陡坡、明显落差和窄终点
    rationale: M1 可在平转角收速，仍有连续下降感，保持相机与输入方向
    decided_by: 用户于 2026-11-10 明确选择 M1 并保留原相机方向
  - decision: ADR-0011 局部四点边缘覆盖
    alternatives_considered: 240×200或360×300整帧四点
    rationale: 主机对照显示几何覆盖改善轮廓，局部方案复用深度缓冲并限制工作区
    decided_by: 负责人2026-11-10在看到对照及建议后要求继续做
  - decision: ADR-0010 240×200单采样与1.5倍抗锯齿缩放
    alternatives_considered: 同分辨率双采样，增加缓冲与帧耗时
    rationale: 细化轮廓台阶并优先跟手
    decided_by: 负责人2026-11-09交互选择A
  - decision: ADR-0009固定斜俯视透视，保持屏幕相对操控
    alternatives_considered: 固定等距俯视
    rationale: 三面可见且保留近大远小，符合仓鼠球参考图
    decided_by: 负责人2026-11-09交互选择A
  - decision: ADR-0008近景固定朝向跟随球与宽平台转弯赛道
    alternatives_considered: B保留全景并放大显示区域
    rationale: 解决球和路太小，接受局部视野，物理手感参数后置
    decided_by: 用户2026-11-09明确回复a
  - decision: B三维视图采用正对赛道固定透视相机，见ADR-0007
    alternatives_considered: camera=(8,-8,7)斜角观察，需要混合世界x/y输入映射
    rationale: camera=(3,-8,6)看(3,0,0.2)，地面屏幕右=世界+x、屏幕上=世界+y，A据此映射IMU；B不反转或交换轴
    decided_by: 用户明确回复“确认推荐相机，按此完成首批开发”
  - decision: 真3D采用独立物理任务方案A，先交付P0迟帧容错
    alternatives_considered: 沿用UI任务拥有状态并有界补算/降低绘制频率
    rationale: 物理与显示解耦符合碰撞手感优先，接受新消息/快照与线程清理成本；P0先在现有线程验证250ms有界补算与严重卡顿可恢复暂停
    decided_by: 王若豪明确确认方案A及5ms/250ms分阶段计划
  - decision: 下一阶段选择低多边形真3D，物理碰撞手感优先，见ADR-0006
    alternatives_considered: 丰富现有2D玩法，或固定视角2.5D表现
    rationale: 负责人坚持真实三维滚球，允许画面不精细，重点惯性/碰撞/摩擦/掉落并要求放宽延迟；后续已确认独立物理任务与5ms/250ms分阶段计划
    decided_by: 王若豪于2026-11-08明确要求真3D与物理优先
  - decision: 中文开始准备界面采用同页遮罩，见ADR-0005
    alternatives_considered: 独立准备页，增加跨页面导航与生命周期引用成本
    rationale: 复用已验证renderer、动作与清理，准备状态由真实CALIBRATING驱动，失败手动RESTART；保留唯一时钟和原阈值
    decided_by: 王若豪于2026-11-08明确确认方案A
  - decision: 以B的Lab/LVGL工程943e762为最终整机基线，见ADR-0004
    alternatives_considered: 以A课程工程为基线选择性移植B的LVGL/触摸
    rationale: 已有显示触摸入口，较快联调；接受依赖多、镜像大与告警需评估的代价
    decided_by: 王若豪于2026-10-31在两案中明确选择方案A
  - decision: 成员 B 选择倾斜控制连续滚动小球
    alternatives_considered: 倾斜触发按格移动
    rationale: 连续运动更直接呈现体感；A 契约说明给出半径 0.20 格和步进边界，模型源码及地图通行仍待核验
    decided_by: 成员 B 明确选择；接口细节依 A 契约说明，待源码联评
  - decision: 成员 B 选择 UI 线程周期推进游戏的一步有界计算
    alternatives_considered: 独立游戏任务通过有界消息和快照通信
    rationale: A 契约说明规定 A 管唯一 UI 刷新入口，B 不另建游戏时钟；生产调度尚未进入本工作副本
    decided_by: 成员 B 明确选择；接口细节依 A 契约说明，待源码联评
  - decision: 首版只做一张固定地图，不做多关卡选关
    alternatives_considered: 首版包含多张地图和选关
    rationale: 收敛首次联调与验收范围
    decided_by: 成员 B 明确选择；待成员 A 共同评审
  - decision: 首版采用16×16蛇形单通道固定地图
    alternatives_considered: 采用带分支或环路的复杂地图
    rationale: 拓扑简明，适合先验证契约映射与四邻接 BFS；连续小球碰撞须另由 A 模型和真机验证
    decided_by: 用户于2026-10-17明确确认
  - decision: 独立游戏首页、迷宫页面和玩法说明，替换Peripheral Lab产品入口
    alternatives_considered: 开机直接进迷宫；延用Lab中的游戏入口
    rationale: 用户明确指出Lab为测试UI并要求重建独立游戏界面，BACK回游戏首页，产品导航与测试用途分离
    decided_by: 用户本会话明确确认；ADR-0002记录
