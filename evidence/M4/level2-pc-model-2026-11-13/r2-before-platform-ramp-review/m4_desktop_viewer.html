<style>

px}.swatches span:before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px;background:var(--paint)}#selection{font-size:15px;font-weight:600;color:#e1edf5;margin-bottom:7px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.metric{background:#203845;padding:9px;border-radius:6px}.metric strong{display:block;font-size:17px}.metric span{font-size:11px;color:#9db5c5}.check{font-size:12px;padding:7px 0;display:flex;gap:8px}.check b{color:#a7dab5;font-size:11px;font-weight:600;min-width:34px}.check div{color:#b8cad7}.check small{display:block;color:#92adbc;margin-top:2px}a{color:#92d2e4;text-decoration:none}.links{display:flex;gap:12px;font-size:12px}#error{position:absolute;top:40%;left:10%;right:10%;padding:20px;background:#492f31;display:none} @media(max-width:850px){.layout{grid-template-columns:1fr;height:auto}.scene{height:70vh;min-height:500px}aside{border-left:0;border-top:1px solid #324352}.toolbar{gap:4px}header{padding:0 15px}h1{font-size:17px}}
</style></head><body>
<header><div><h1>第二关 · 电脑模型审阅</h1><div class="sub">整关模型 / 分层与接缝检查 / 米</div></div><span class="tag">电脑模型 r2 · 尚未移植</span></header>
<div class="layout"><main class="scene"><canvas id="view" tabindex="0" aria-label="可拖动旋转的第二关完整三维模型"></canvas><div class="toolbar"><button data-preset="whole" class="active">全貌</button><button data-preset="top">俯视</button><button data-preset="follow">游戏跟随视角</button><button data-preset="save">存档圆盘</button><button data-preset="pier">双弯局部</button><button data-preset="chutes">双陡降</button><button id="reset">复位</button></div><div class="foot">左键旋转 · 右键平移 · 滚轮缩放 · 点击部件查看</div><div class="stat" id="stat"></div><div id="error"></div></main>
<aside><div class="section"><h2>查看层级</h2><select id="layer" aria-label="显示层级"><option value="all">整关 · 所有层</option><option value="upper">上层与折返连接</option><option value="lower">双陡降与终点</option><option value="supports">仅实体台柱 / 护墙</option></select><div class="row"><label><input id="walls" type="checkbox" checked> 实体台柱 / 护墙</label><label><input id="markers" type="checkbox" checked> 标记</label></div><div class="row"><label><input id="wire" type="checkbox"> 网格线</label><label><input id="route" type="checkbox"> 路线</label></div><div class="row"><label for="explode">拆层查看</label><span class="muted" id="explodeValue">0.0 m</span></div><input id="explode" type="range" min="0" max="1.5" step=".1" value="0"><div class="muted">拆层只影响查看，不改变导出模型。</div></div>
<div class="section"><h2>部件检查</h2><select id="parts" aria-label="选择模型部件"><option value="">点击模型或选择部件</option></select><div style="margin-top:13px" id="selection">整关</div><div class="muted" id="detail">旋转模型，检查存档台、连接面、柱体及下层净空。</div><div class="metrics"><div class="metric"><strong id="partCount">—</strong><span>模型部件</span></div><div class="metric"><strong id="extent">—</strong><span>平面范围 / m</span></div></div></div>
<div class="section"><h2>几何检查</h2><div id="checks"></div></div>
<div class="section"><h2>沿线检查</h2><div class="row"><button id="play">沿线巡看</button><label><input type="checkbox" id="ball" checked> 参照球 Ø0.4m</label></div><input id="progress" aria-label="沿线位置" type="range" min="0" max="1000" value="0"><div class="muted">游戏跟随视角使用已检查方向；拖动进度巡看。路径示意，尚未物理验收。</div></div>
<div class="swatches"><span style="--paint:#66b9d6">承载路面</span><span style="--paint:#f6d665">存档台</span><span style="--paint:#8ac879">终点</span><span style="--paint:#32768c">实体台柱</span></div><div class="links" style="margin-top:18px"><a href="level2-desktop.glb" download>GLB 模型</a><a href="level2-desktop.obj" download>OBJ 模型</a><a href="model.json" download>模型数据</a></div></aside></div>
<script>
const MODEL=__MODEL_DATA__;
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('view'),gl=canvas.getContext('webgl',{antialias:true,alpha:false});
if(!gl){$('error').style.display='block';$('error').textContent='当前浏览器未启用 WebGL，请用 Edge 或 Chrome 打开。';return}
const vs=`attribute vec3 p;attribute vec3 n;attribute vec3 c;uniform mat4 vp;uniform float shift;uniform float highlight;varying vec3 color;void main(){vec3 q=p+vec3(0.,0.,shift);gl_Position=vp*vec4(q,1.);float light=.52+.48*abs(dot(normalize(n),normalize(vec3(.35,-.45,1.))));color=mix(c*light,vec3(1.,.72,.25),highlight);}`;
const fs=`precision mediump float;varying vec3 color;void main(){gl_FragColor=vec4(color,1.);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const loc={p:gl.getAttribLocation(prog,'p'),n:gl.getAttribLocation(prog,'n'),c:gl.getAttribLocation(prog,'c'),vp:gl.getUniformLocation(prog,'vp'),shift:gl.getUniformLocation(prog,'shift'),highlight:gl.getUniformLocation(prog,'highlight')};
const add=(a,b)=>a.map((x,i)=>x+b[i]),sub=(a,b)=>a.map((x,i)=>x-b[i]),mul=(a,s)=>a.map(x=>x*s),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>mul(a,1/Math.hypot(...a));
function multiply(a,b){const out=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)out[c*4+r]+=a[k*4+r]*b[c*4+k];return out}
function look(eye,target){const z=norm(sub(eye,target)),x=norm(cross([0,0,1],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1])}
function perspective(aspect){const f=1/Math.tan(Math.PI/7),near=.08,far=180;return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0])}
function upload(arr){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW);return b}
function gpu(o){const edges=[];for(let i=0;i<o.p.length;i+=9){const a=o.p.slice(i,i+3),b=o.p.slice(i+3,i+6),c=o.p.slice(i+6,i+9);edges.push(...a,...b,...b,...c,...c,...a)}return {...o,bp:upload(o.p),bn:upload(o.n),bc:upload(o.c),be:upload(edges),ec:edges.length/3,count:o.p.length/3}}
const objects=MODEL.objects.map(gpu),byId=new Map(objects.map(o=>[o.id,o]));
const cam={target:[-.15,1,1.8],yaw:-2.4,pitch:.8,dist:20};let selected=null,playing=false,position=0,last=0,dirty=true;
function currentEye(){return add(cam.target,[cam.dist*Math.cos(cam.pitch)*Math.cos(cam.yaw),cam.dist*Math.cos(cam.pitch)*Math.sin(cam.yaw),cam.dist*Math.sin(cam.pitch)])}
function shown(o){if(o.kind==='marker'&&!$('markers').checked)return false;if((o.kind==='support'||o.kind==='guard')&&!$('walls').checked)return false;const layer=$('layer').value;return layer==='all'||layer==='upper'&&o.stage<2||layer==='lower'&&o.stage>=2||layer==='supports'&&(o.kind==='support'||o.kind==='guard'||o.bottom===-2)}
function bind(buffer,attribute){gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.enableVertexAttribArray(attribute);gl.vertexAttribPointer(attribute,3,gl.FLOAT,false,0,0)}
function draw(o,shift=0,highlight=0,lines=false){bind(lines?o.be:o.bp,loc.p);bind(o.bn,loc.n);bind(o.bc,loc.c);if(lines){gl.disableVertexAttribArray(loc.n);gl.vertexAttrib3f(loc.n,0,0,1);gl.disableVertexAttribArray(loc.c);gl.vertexAttrib3f(loc.c,.15,.3,.36)}gl.uniform1f(loc.shift,shift);gl.uniform1f(loc.highlight,highlight);gl.drawArrays(lines?gl.LINES:gl.TRIANGLES,0,lines?o.ec:o.count)}
const ground={p:[],n:[],c:[]};for(let i=-8;i<=8;i++)for(const p of [[-8,i,-2.025],[8,i,-2.025],[i,-8,-2.025],[i,8,-2.025]]){ground.p.push(...p);ground.n.push(0,0,1);ground.c.push(.2,.29,.34)}ground.bp=upload(ground.p);ground.bn=upload(ground.n);ground.bc=upload(ground.c);ground.count=ground.p.length/3;
const routeObj={p:[],n:[],c:[]};for(let i=0;i<MODEL.route.length-1;i++){routeObj.p.push(...MODEL.route[i],...MODEL.route[i+1]);routeObj.n.push(0,0,1,0,0,1);routeObj.c.push(1,.72,.3,1,.72,.3)}routeObj.bp=upload(routeObj.p);routeObj.bn=upload(routeObj.n);routeObj.bc=upload(routeObj.c);routeObj.count=routeObj.p.length/3;
const ball={p:[],n:[],c:[]};function ballTri(a,b,c){for(const p of [a,b,c]){ball.p.push(...mul(p,.2));ball.n.push(...p);ball.c.push(.98,.48,.22)}}function sphere(lat,lon){return [Math.sin(lat)*Math.cos(lon),Math.sin(lat)*Math.sin(lon),Math.cos(lat)]}for(let i=0;i<12;i++)for(let j=0;j<20;j++){const a=sphere(Math.PI*i/12,2*Math.PI*j/20),b=sphere(Math.PI*(i+1)/12,2*Math.PI*j/20),c=sphere(Math.PI*(i+1)/12,2*Math.PI*(j+1)/20),d=sphere(Math.PI*i/12,2*Math.PI*(j+1)/20);ballTri(a,b,c);ballTri(a,c,d)}ball.bp=upload(ball.p);ball.bn=upload(ball.n);ball.bc=upload(ball.c);ball.count=ball.p.length/3;
function routePoint(t){const v=t*(MODEL.route.length-1),i=Math.min(MODEL.route.length-2,Math.floor(v)),f=v-i;return add(mul(MODEL.route[i],1-f),mul(MODEL.route[i+1],f))}
function drawFrame(){if(follow){cam.target=routePoint(position);cam.yaw=MODEL.camera.yaw;cam.pitch=MODEL.camera.pitch;cam.dist=MODEL.camera.distance}const dpr=Math.min(devicePixelRatio||1,2),w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.clearColor(.075,.14,.19,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);const vp=multiply(perspective(w/h),look(currentEye(),cam.target));gl.uniformMatrix4fv(loc.vp,false,vp);gl.uniform1f(loc.shift,0);gl.uniform1f(loc.highlight,0);bind(ground.bp,loc.p);bind(ground.bn,loc.n);bind(ground.bc,loc.c);gl.drawArrays(gl.LINES,0,ground.count);for(const o of objects)if(shown(o)){const shift=(3-o.stage)*Number($('explode').value);draw(o,shift,selected===o ? .22 : 0);if($('wire').checked)draw(o,shift,0,true)}if($('route').checked){bind(routeObj.bp,loc.p);bind(routeObj.bn,loc.n);bind(routeObj.bc,loc.c);gl.uniform1f(loc.shift,0);gl.uniform1f(loc.highlight,0);gl.drawArrays(gl.LINES,0,routeObj.count)}if($('ball').checked&&$('explode').value==='0'){const point=routePoint(position),translated=ball.p.map((x,i)=>x+point[i%3]);gl.bindBuffer(gl.ARRAY_BUFFER,ball.bp);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(translated),gl.DYNAMIC_DRAW);draw(ball)}$('stat').textContent=`${Math.round(cam.dist*10)/10} m · ${objects.filter(shown).length} 个可见部件`;window.modelReviewState={revision:MODEL.revision,selected:selected?.id||null,view:cam,visible:objects.filter(shown).length,checks:MODEL.checks};dirty=false}
function animate(time){if(playing){position=(position+(time-last)*.000018)%1;$('progress').value=Math.round(position*1000);dirty=true}last=time;if(dirty)drawFrame();requestAnimationFrame(animate)}requestAnimationFrame(animate);
let follow=false;function preset(name){follow=name==='follow';selected=null;$('parts').value='';$('selection').textContent='整关';$('detail').textContent='旋转模型，检查连接面、柱体及下层净空。';const presets={whole:[[-.15,1,1.8],-2.4,.8,20],top:[[0,1,1.8],-2.4,1.56,19],save:[[.9,2.7,4.65],-2.4,.8,5],pier:[[1.3,2.8,3.6],-2.4,.8,12],chutes:[[-2.7,-.7,1.5],-2.4,.8,10]};if(!follow)[cam.target,cam.yaw,cam.pitch,cam.dist]=presets[name];document.querySelectorAll('[data-preset]').forEach(b=>b.classList.toggle('active',b.dataset.preset===name));dirty=true}
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>preset(b.dataset.preset));$('reset').onclick=()=>{for(const id of ['wire','route'])$(id).checked=false;for(const id of ['walls','markers','ball'])$(id).checked=true;$('explode').value=0;$('explodeValue').textContent='0.0 m';$('layer').value='all';position=0;$('progress').value=0;playing=false;$('play').textContent='沿线巡看';preset('whole')};
for(const id of ['layer','walls','markers','wire','route','ball'])$(id).onchange=()=>dirty=true;$('explode').oninput=()=>{$('explodeValue').textContent=Number($('explode').value).toFixed(1)+' m';dirty=true};$('progress').oninput=()=>{position=Number($('progress').value)/1000;dirty=true};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停巡看':'沿线巡看';dirty=true};
let drag=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,button:e.button}});canvas.addEventListener('pointermove',e=>{if(!drag)return;follow=false;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.button===2||e.shiftKey){const right=[-Math.sin(cam.yaw),Math.cos(cam.yaw),0],up=norm(cross(norm(sub(cam.target,currentEye())),right));cam.target=add(cam.target,add(mul(right,-dx*cam.dist*.0015),mul(up,dy*cam.dist*.0015)))}else{cam.yaw-=dx*.006;cam.pitch=Math.max(.06,Math.min(1.56,cam.pitch+dy*.005))}drag.x=e.clientX;drag.y=e.clientY;dirty=true});canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('wheel',e=>{e.preventDefault();cam.dist=Math.max(2,Math.min(65,cam.dist*Math.exp(e.deltaY*.001)));dirty=true},{passive:false});
function hitTriangle(origin,dir,a,b,c){const e1=sub(b,a),e2=sub(c,a),h=cross(dir,e2),det=dot(e1,h);if(Math.abs(det)<1e-8)return Infinity;const s=sub(origin,a),u=dot(s,h)/det;if(u<0||u>1)return Infinity;const q=cross(s,e1),v=dot(dir,q)/det;if(v<0||u+v>1)return Infinity;const t=dot(e2,q)/det;return t>.05?t:Infinity}
function select(o,focus){selected=o;$('parts').value=o?.id||'';if(!o)return;const b=o.bounds;$('selection').textContent=o.name;$('detail').textContent=`高度 ${b[0][2].toFixed(2)} ～ ${b[1][2].toFixed(2)} m · ${MODEL.stages[o.stage]} · ${o.kind==='support'?'实体支撑 / 可作墙面':o.kind==='guard'?'实体护墙':o.kind==='marker'?'视觉标记':'承载面'}`;if(focus){cam.target=b[0].map((v,i)=>(v+b[1][i])/2);cam.dist=Math.max(4,Math.hypot(...sub(b[1],b[0]))*1.8)}dirty=true}
canvas.addEventListener('pointerup',e=>{if(drag&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<4){const rect=canvas.getBoundingClientRect(),x=(2*(e.clientX-rect.left)/rect.width-1)*rect.width/rect.height*Math.tan(Math.PI/7),y=(1-2*(e.clientY-rect.top)/rect.height)*Math.tan(Math.PI/7),eye=currentEye(),forward=norm(sub(cam.target,eye)),right=norm(cross(forward,[0,0,1])),up=cross(right,forward),dir=norm(add(forward,add(mul(right,x),mul(up,y))));let distance=Infinity,chosen=null;for(const o of objects)if(shown(o)&&o.kind!=='marker'){const shift=(3-o.stage)*Number($('explode').value);for(let i=0;i<o.p.length;i+=9){const v=[0,3,6].map(k=>[o.p[i+k],o.p[i+k+1],o.p[i+k+2]+shift]);const t=hitTriangle(eye,dir,...v);if(t<distance){distance=t;chosen=o}}}if(chosen)select(chosen,false)}drag=null});
for(const o of objects)if(o.kind!=='marker'){const op=document.createElement('option');op.value=o.id;op.textContent=o.name;$('parts').append(op)}$('parts').onchange=()=>select(byId.get($('parts').value),true);
$('partCount').textContent=objects.filter(o=>o.kind!=='marker').length;const allBounds=objects.filter(o=>o.kind!=='marker').map(o=>o.bounds);const span=[0,1].map(k=>Math.max(...allBounds.map(b=>b[1][k]))-Math.min(...allBounds.map(b=>b[0][k])));$('extent').textContent=span.map(x=>x.toFixed(1)).join(' × ');for(const c of MODEL.checks){const el=document.createElement('div');el.className='check';const b=document.createElement('b');b.textContent=c.status==='FIXED'?'已修正':'通过';const div=document.createElement('div');div.textContent=c.name;const small=document.createElement('small');small.textContent=c.detail;div.append(small);el.append(b,div);$('checks').append(el)}new ResizeObserver(()=>dirty=true).observe(canvas);
window.modelReviewApi={preset,select:id=>select(byId.get(id),true),model:MODEL,render:()=>{dirty=true;drawFrame()},getState:()=>window.modelReviewState};
})();
</script></body></html>
